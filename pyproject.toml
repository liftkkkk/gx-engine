[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gx-engine"
version = "1.5.3"
description = "GX 图引擎——内存图存储、图搜索、图分区与语义检索（国产自研）"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "GX Contributors" }]
keywords = ["graph", "graph-engine", "graph-search", "graph-partition", "graphrag"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Mathematics",
]
requires-python = ">=3.9"
dependencies = [
    "networkx>=2.6",
    "numpy",
    "scikit-learn",
]

[project.optional-dependencies]
viz = ["pyvis", "matplotlib"]
embed = ["openai", "torch", "transformers"]

[tool.setuptools]
py-modules = ["graph_engine", "graph_rag"]
